[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-stampede"
version = "0.1.0"
description = "Local astronomical cutout review and classification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pandas>=1.5", "pyarrow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7", "build"]

[project.scripts]
astro-stampede = "astro_stampede.cli:main"

[tool.setuptools.packages.find]
include = ["astro_stampede*"]

[tool.setuptools.package-data]
astro_stampede = ["review_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
