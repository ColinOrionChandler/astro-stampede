[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-stampede"
dynamic = ["version"]
description = "Local astronomical cutout review and classification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Colin Chandler"}]
requires-python = ">=3.10"
dependencies = ["pandas>=1.5", "pyarrow>=10"]

[project.urls]
"Source Code" = "https://github.com/ColinOrionChandler/astro-stampede"

[project.optional-dependencies]
dev = ["pytest>=7", "build"]

[project.scripts]
astro-stampede = "astro_stampede.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["astro_stampede*"]

[tool.setuptools.package-data]
astro_stampede = ["review_static/*"]

[tool.setuptools_scm]
version_file = "src/astro_stampede/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
