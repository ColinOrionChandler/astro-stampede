name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install '.[dev]'
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_trails.cjs
      - run: python -m build
      - run: python tools/audit_public.py --history --artifact dist/astro_stampede-0.1.0-py3-none-any.whl --artifact dist/astro_stampede-0.1.0.tar.gz
