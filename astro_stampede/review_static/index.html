<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="appTitle">Astro Stampede</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="brand">
          <h1 id="brandTitle">Astro Stampede</h1>
          <button id="rescanBtn" title="Rescan PNG tree">Rescan</button>
        </header>
        <div class="summary" id="summary">Loading index...</div>
        <div class="batch-panel" id="batchPanel" hidden>
          <label for="batchSelect">Review batch</label>
          <select id="batchSelect"></select>
          <div class="batch-progress" id="batchProgress"></div>
        </div>
        <div class="filters">
          <input id="searchInput" type="search" placeholder="Object search" />
          <select id="productSelect" class="rcc-layout-filter">
            <option value="">All products</option>
            <option value="preliminary_visit_image">Preliminary</option>
            <option value="difference_image">Difference</option>
          </select>
          <input id="classInput" type="search" placeholder="Class filter" />
          <input
            id="minPctPeriInput"
            class="rcc-orbital-filter"
            type="number"
            min="0"
            max="100"
            step="1"
            placeholder="Min pct-peri"
          />
          <input
            id="maxDeltaMagInput"
            class="rcc-orbital-filter"
            type="number"
            step="0.1"
            placeholder="Max delta-mag"
          />
          <label class="checkline rcc-orbital-filter">
            <input id="includeMissingDeltaMagInput" type="checkbox" checked />
            <span>Include no delta-mag</span>
          </label>
          <input
            id="maxTjInput"
            class="rcc-orbital-filter"
            type="number"
            step="0.01"
            placeholder="Max TJ"
          />
          <label class="checkline rcc-orbital-filter">
            <input id="includeMissingTjInput" type="checkbox" checked />
            <span>Include no TJ</span>
          </label>
          <select id="stateSelect">
            <option value="">Any review state</option>
            <option value="unreviewed">Unreviewed</option>
            <option value="active">Active candidates</option>
          </select>
          <select id="scoreStateSelect">
            <option value="">Any score state</option>
            <option value="unscored">Has unscored images</option>
            <option value="scored">Fully scored</option>
          </select>
          <label class="checkline" id="revealMissingDetailsControl" hidden>
            <input id="revealMissingDetailsInput" type="checkbox" />
            <span>Has reveal cutouts missing details</span>
          </label>
          <select id="presetSelect" class="rcc-layout-filter">
            <option value="">Queue preset</option>
            <option value="comets-centaurs">Comets + Centaurs</option>
            <option value="active-unscored">Active + unscored</option>
            <option value="artifact-audit">Artifact audit</option>
          </select>
          <input id="minImagesInput" type="number" min="1" step="1" value="2" title="Minimum thumbnails" />
          <label class="checkline">
            <input id="unscoredFirstInput" type="checkbox" checked />
            <span>Unscored first</span>
          </label>
          <label class="checkline">
            <input id="reverseSortInput" type="checkbox" />
            <span>Reverse sort</span>
          </label>
        </div>
        <div class="object-list" id="objectList"></div>
      </aside>

      <main class="viewer">
        <section class="toolbar">
          <button id="prevBtn" title="Previous image">Prev</button>
          <button id="playBtn" title="Play or pause">Play</button>
          <button id="nextBtn" title="Next image">Next</button>
          <label>
            <span>Rate</span>
            <input id="rateInput" type="range" min="0.5" max="12" step="0.5" value="2" />
            <output id="rateOutput">2 fps</output>
          </label>
          <select id="scaleSelect" title="Exact pixel scale">
            <option value="fit">Fit</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
          </select>
          <label class="checkline">
            <input id="loopInput" type="checkbox" checked />
            <span>Loop current object</span>
          </label>
          <label class="checkline">
            <input id="pingPongInput" type="checkbox" />
            <span>Ping-pong</span>
          </label>
          <label class="checkline">
            <input id="invertInput" type="checkbox" />
            <span>Invert</span>
          </label>
          <button id="blinkBtn" title="Blink the current image and its comparison" aria-pressed="false" disabled>Blink pair</button>
          <button id="activeBtn" class="active-command" title="Mark object active" aria-pressed="false">Active</button>
          <label class="checkline" id="revealOnlyControl" hidden>
            <input id="revealOnlyInput" type="checkbox" />
            <span>Show reveal-scored only</span>
          </label>
          <label class="checkline" id="revealContextControl" hidden
            title="Include each reveal-scored image and its 10 preceding and 10 following images. Overrides reveal-scored only.">
            <input id="revealContextInput" type="checkbox" />
            <span>±10 images from reveal-scored</span>
          </label>
          <button
            id="revealBtn"
            class="reveal-command"
            title="Reveal AI scores for the current object"
            aria-pressed="false"
            hidden
          >Reveal</button>
          <button id="exportBtn" title="Export labels">Export</button>
          <button id="shutdownBtn" class="danger-command" title="Save classifications and stop the review server">Shutdown</button>
        </section>

        <section class="object-title">
          <div>
            <h2 id="objectTitle">Choose an object</h2>
            <p id="objectSubtitle">Select an object from the queue to review its PNG cutouts.</p>
          </div>
          <div class="counter" id="imageCounter">0 / 0</div>
        </section>

        <section class="canvas-wrap">
          <div class="image-stage" id="imageStage">
            <figure class="image-panel">
              <figcaption id="primaryCaption" hidden>Original · scoring this image</figcaption>
              <img id="mainImage" alt="Review thumbnail" />
              <p class="image-filename" id="primaryFilename"></p>
            </figure>
            <figure class="image-panel" id="comparisonPanel" hidden>
              <figcaption id="comparisonCaption">Comparison</figcaption>
              <img id="comparisonImage" alt="Mapped comparison cutout" />
              <p class="image-filename" id="comparisonFilename"></p>
              <p id="comparisonStatus" role="status"></p>
            </figure>
          </div>
        </section>
      </main>

      <aside class="inspector">
        <section>
          <h2>Scoring</h2>
          <div class="current-score" id="currentScore">Unscored</div>
          <div
            class="reveal-indicator"
            id="revealIndicator"
            role="status"
            aria-live="polite"
            hidden
          ></div>
          <div class="save-status" id="saveStatus">Saved</div>
          <div class="score-grid" id="scoreGrid"></div>
          <div class="score-actions">
            <button id="skipBtn">Skip</button>
            <button id="clearBtn">Clear</button>
            <button id="undoBtn">Undo</button>
          </div>
        </section>
        <section>
          <h2>Display</h2>
          <label>
            <span>Brightness</span>
            <input id="brightnessInput" type="range" min="50" max="180" value="100" />
          </label>
          <label>
            <span>Contrast</span>
            <input id="contrastInput" type="range" min="50" max="220" value="100" />
          </label>
        </section>
        <section>
          <h2>Tags</h2>
          <div class="tag-grid" id="tagGrid"></div>
          <textarea id="commentInput" rows="4" placeholder="Optional note"></textarea>
        </section>
        <section>
          <h2>Metadata</h2>
          <dl id="metadata"></dl>
        </section>
      </aside>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
